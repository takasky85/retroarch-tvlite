name: TV Lite APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Link with lld
      run: sh .github/workflows/scripts/use-lld.sh

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Bundle TV Lite assets (Ozone, fonts, sounds, controller profiles)
      run: sh pkg/android/phoenix/tvlite-bundle-assets.sh

    - name: Signing key (one fixed key, so each build installs over the last)
      env:
        KEYSTORE_B64: ${{ secrets.TVLITE_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.TVLITE_KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvlite.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/tvlite.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=tvlite"
            echo "RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> pkg/android/phoenix/gradle.properties
        else
          echo "::warning::No TVLITE_KEYSTORE_B64 secret: the APK is signed with a throwaway key and will not install over an earlier build"
        fi

    - name: Compile RA
      run: |
        cd pkg/android/phoenix
        # A repository that answers with a server error is retried with
        # a backoff (2 s doubling, six tries) before Gradle gives up on
        # it for the rest of the build. A build that still fails to fetch
        # a dependency is run again, keeping what it already fetched and
        # built; any other failure fails the step at once.
        set -o pipefail
        for i in 1 2 3; do
          ./gradlew checkNativeBuildParallelism assembleTvliteRelease \
            -Dorg.gradle.internal.repository.max.tentatives=6 \
            -Dorg.gradle.internal.repository.initial.backoff=2000 \
            2>&1 | tee gradle.log && break
          grep -qE 'Could not (resolve|GET|HEAD|download)' gradle.log \
            && [ $i != 3 ] || exit 1
          echo "dependency fetch failed (attempt $i); retrying in 30s"
          sleep 30
        done
        find . -iname "*.apk" -exec ls -l "{}" \;

    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-tvlite-${{ steps.slug.outputs.sha8 }}
        path: |
          pkg/android/phoenix/build/outputs/apk/tvlite/release/phoenix-tvlite-release.apk

